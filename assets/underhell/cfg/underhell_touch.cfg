// Underhell extra controls for an already-installed port: exec underhell_touch.cfg
// Re-running resets ONLY these 14 action buttons, never movement/attack controls.
touch_enable 1
touch_draw 1
touch_removebutton "uh_inventory"
touch_addbutton "uh_inventory" "vgui/touch/underhell/inventory" "cl_inventoryToggle" 0.150 0.020 0.210 0.120 255 255 255 220 0 1
touch_removebutton "uh_aim"
touch_addbutton "uh_aim" "vgui/touch/underhell/aim" "ironsight_toggle" 0.217 0.020 0.277 0.120 255 255 255 220 0 1
touch_removebutton "uh_nightvision"
touch_addbutton "uh_nightvision" "vgui/touch/underhell/nightvision" "NightVision_Toggle" 0.284 0.020 0.344 0.120 255 255 255 220 0 1
touch_removebutton "uh_gasmask"
touch_addbutton "uh_gasmask" "vgui/touch/underhell/gasmask" "GasMask_Toggle" 0.351 0.020 0.411 0.120 255 255 255 220 0 1
touch_removebutton "uh_laser"
touch_addbutton "uh_laser" "vgui/touch/underhell/laser" "laser_toggle" 0.150 0.180 0.210 0.280 255 255 255 220 0 1
touch_removebutton "uh_silencer"
touch_addbutton "uh_silencer" "vgui/touch/underhell/silencer" "silencer_toggle" 0.217 0.180 0.277 0.280 255 255 255 220 0 1
touch_removebutton "uh_firemode"
touch_addbutton "uh_firemode" "vgui/touch/underhell/firemode" "firemode_toggle" 0.284 0.180 0.344 0.280 255 255 255 220 0 1
touch_removebutton "uh_objective"
