touch_removebutton "uh_grenade"
touch_addbutton "uh_grenade" "vgui/touch/underhell/grenade" "Throw_Nade" 0.587 0.180 0.647 0.280 255 255 255 220 0 1
touch_removebutton "uh_bullettime"
touch_addbutton "uh_bullettime" "vgui/touch/underhell/bullettime" "impulse 110" 0.654 0.180 0.714 0.280 255 255 255 220 0 1
touch_removebutton "uh_drop"
